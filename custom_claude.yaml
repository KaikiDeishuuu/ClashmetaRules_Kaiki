# Claude / Anthropic 专属规则集
# behavior: classical —— 支持 DOMAIN-KEYWORD 兜底（domain 行为不支持关键词）
# 主配置 rule-providers.custom_claude.behavior 必须保持 classical，勿改回 domain
# URL: https://raw.githubusercontent.com/KaikiDeishuuu/ClashmetaRules_Kaiki/main/custom_claude.yaml

payload:
  # ====== Claude / Anthropic 明确域名 ======
  - 'DOMAIN-SUFFIX,anthropic.com'
  - 'DOMAIN-SUFFIX,claude.ai'
  - 'DOMAIN-SUFFIX,claude.com'
  - 'DOMAIN-SUFFIX,claudeusercontent.com'
  - 'DOMAIN-SUFFIX,claude.site'

  # ====== 关键词兜底：域名任意位置含 claude / anthropic 一律走 Claude 组 ======
  - 'DOMAIN-KEYWORD,claude'
  - 'DOMAIN-KEYWORD,anthropic'

  # ====== Claude 网页端账单与支付网关 ======
  # Stripe、hCaptcha 为共享服务；纳入后，其他使用这些服务的网站也会命中本规则集。
  - 'DOMAIN-SUFFIX,stripe.com'
  - 'DOMAIN-SUFFIX,stripecdn.com'
  - 'DOMAIN,m.stripe.network'
  - 'DOMAIN-SUFFIX,hcaptcha.com'
